header:
  version: 14
  includes:
  - kas/include/mender-full.yml
  - kas/include/st.yml

repos:
  meta-mender-community:
    layers:
      meta-mender-st-stm32mp:

local_conf_header:
  stm32mp2: |
    INHERIT += "devshell"
    #uboot env is different for emmc or sdcard
    #STM32 seem to want to put the env in these locations
    MENDER_UBOOT_ENV_STORAGE_DEVICE_OFFSET_1 = "0x97C408"
    MENDER_UBOOT_ENV_STORAGE_DEVICE_OFFSET_2 = "0x980400"
    BOOTENV_SIZE = "0x4000"
    MENDER_STORAGE_DEVICE = "/dev/mmcblk0"
    MENDER_ROOTFS_PART_A = "${MENDER_STORAGE_DEVICE_BASE}8"
    MENDER_ROOTFS_PART_B = "${MENDER_STORAGE_DEVICE_BASE}9"
    MENDER_DATA_PART_NUMBER = "10"
    MENDER_DATA_PART_SIZE_MB = "10"
    #To make the license happy, you are accecpting the eula for stm 
    ACCEPT_EULA_stm32mp2 = "1"
    ACCEPT_EULA_stm32mp2-dk-mender = "1"
    #This has no boot partition
    MENDER_BOOT_PART_SIZE_MB = "0"
    #using a different version of systemd
    BBMASK="meta-st-openstlinux/oe-core/recipes-core/systemd/systemd_255.17.bbappend"
    #remove the standard stm paritons
    ST_BOOTFS = "0"
    ST_USERFS = "0"
    ST_VENDORFS = "0"
    # use mender data reseize instead
    DISTRO_FEATURES:remove = " autoresize "
    MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = " kernel-devicetree"
    IMAGE_FSTYPES:append = " dataimg mender"

machine: stm32mp2-dk-mender
target:
  - st-image-core

