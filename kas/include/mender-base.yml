header:
  version: 14

distro: poky

repos:
  openembedded-core:
    url: git://git.openembedded.org/openembedded-core.git
    # yocto-5.0.15
    commit: master
    layers:
      meta:

  bitbake:
    url: git://git.openembedded.org/bitbake.git
    # yocto-5.0.15
    commit: master
    layers:
      bitbake: disabled

  meta-yocto:
    url: git://git.yoctoproject.org/git/meta-yocto.git
    # yocto-5.0.15
    commit: master
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: git://git.openembedded.org/meta-openembedded
    # branch: scarthgap
    commit: master
    layers:
      meta-oe:

  meta-mender:
    url: https://github.com/mendersoftware/meta-mender.git
    # scarthgap-v2025.11
    commit: master

    layers:
      meta-mender-core:

local_conf_header:
  base: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    INIT_MANAGER = "systemd"
    # The following allows root login without a password for convenience.
    # Use with care, and never in product builds.
    EXTRA_IMAGE_FEATURES ?= "allow-empty-password empty-root-password allow-root-login"
  
  mender-artifact: |
    MENDER_ARTIFACT_NAME = "gha_autobuild"

target:
  - core-image-minimal
