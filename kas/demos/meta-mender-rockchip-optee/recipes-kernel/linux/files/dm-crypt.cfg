# dm-crypt: device-mapper encryption target
# Required for cryptsetup luksOpen / LUKS encrypted partitions.
# Built-in (=y) to avoid module load race with firstboot-init service.
CONFIG_DM_CRYPT=y

# Device mapper core (dm-crypt depends on this)
CONFIG_BLK_DEV_DM=y

# Crypto support needed by LUKS2 (aes-xts-plain64 + sha256)
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_SHA512=y
