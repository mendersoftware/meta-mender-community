# Enable TPM fTPM TEE driver for OP-TEE firmware TPM
# TCG_FTPM_TEE stays =m: the fTPM is a loadable TA, so tee-supplicant must be
# running before the driver probes. It is modprobed via ExecStartPost in the
# tee-supplicant@.service. CONFIG_TCG_TPM=y is required as a base dependency.
CONFIG_TCG_TPM=y
CONFIG_TCG_FTPM_TEE=m
CONFIG_HW_RANDOM_TPM=m
