[Unit]
After=load-ftpm-tee.service
Requires=load-ftpm-tee.service

[Service]
# Wait until the persistent SRK (0x81000001) is accessible before attempting
# TPM2 token unlock. systemd-cryptsetup calls Esys_Load(parentHandle=SRK);
# if the fTPM TA is still loading its NV state from OP-TEE secure storage the
# persistent handle does not exist yet and Esys_Load returns TPM_RC_HANDLE (0x18b).
# tpm2_readpublic -c 0x81000001 is the correct readiness gate - it reads the
# public area of the persistent SRK and fails until NV replay completes.
ExecStartPre=/bin/sh -c '\
    i=0; while [ $i -lt 60 ]; do \
        tpm2_readpublic -c 0x81000001 >/dev/null 2>&1 && exit 0; \
        echo "[systemd-cryptsetup] SRK not ready ($i/60), waiting..."; \
        sleep 1; i=$((i+1)); \
    done; \
    echo "[systemd-cryptsetup] WARNING: Persistent SRK not accessible after 60s"; \
    exit 0'
