# Enable OP-TEE support in U-Boot
# This allows U-Boot to communicate with OP-TEE and pass control to it
CONFIG_TEE=y
CONFIG_OPTEE=y

# OP-TEE Trusted Application commands available at U-Boot prompt
# optee_rpmb: read/write RPMB via OP-TEE (used by Mender for secure storage)
CONFIG_CMD_OPTEE_RPMB=y

# OP-TEE Trusted Application clients built into U-Boot
# AVB TA: secure rollback counter storage - used by Mender boot counting via OP-TEE
CONFIG_OPTEE_TA_AVB=y
# SCP03 TA: Secure Channel Protocol 03 key provisioning
CONFIG_OPTEE_TA_SCP03=y
# Automatically enumerate and bind OP-TEE hosted service drivers on startup
CONFIG_OPTEE_SERVICE_DISCOVERY=y

# SMC command: allows issuing raw Secure Monitor Calls from U-Boot prompt
# Useful for debugging OP-TEE interactions (e.g. `smc 0xC2000404 ...`)
CONFIG_CMD_SMC=y

# OP-TEE is already provided to U-Boot via BL32/FIT packaging in the recipe.
# Keep SPL OP-TEE shim disabled to avoid pulling 32-bit SPL assembly on arm64 builds.
