header:
  version: 14
  includes:
    - kas/include/mender-full.yml
    - kas/include/tegra-jetpack5.yml

machine: jetson-orin-nano-devkit

local_conf_header:
  AB-upgrades: |
    UBOOT_EXTLINUX = "1"
    USE_REDUNDANT_FLASH_LAYOUT_DEFAULT = "1"
  eMMC: |
    # equivalent: EMMC_SIZE = "32 * 1024 * 1024 * 1024"
    EMMC_SIZE = "34359738368"
  orin-nano-storage: |
    # Orin Nano devkit has no eMMC; SD card enumerates as mmcblk0
    MENDER_STORAGE_DEVICE = "/dev/mmcblk0"
  orin-nano-ethernet: |
    # Carrier board uses Realtek RTL8168 PCIe Ethernet (r8169 driver)
    MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append = " kernel-module-r8169"
