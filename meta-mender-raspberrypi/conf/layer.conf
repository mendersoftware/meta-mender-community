# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mender-raspberrypi"
BBFILE_PATTERN_mender-raspberrypi = "^${LAYERDIR}/"
BBFILE_PRIORITY_mender-raspberrypi = "10"

LAYERDEPENDS_mender-raspberrypi = "mender raspberrypi"

LAYERSERIES_COMPAT_mender-raspberrypi = "wrynose"

# Raspberry Pi doesn't work with GRUB currently.
_MENDER_IMAGE_TYPE_DEFAULT:rpi = "mender-image-sd"
_MENDER_BOOTLOADER_DEFAULT:rpi = "mender-uboot"

# Mender loads the kernel from the selected rootfs, not the shared FAT.
# A :remove cannot be undone, so the removed value goes through a variable
# that boot scripts reading the FAT kernel can set to an empty string.
RPI_MENDER_EXTRA_IMAGE_BOOT_FILES_REMOVE ?= "${@bb.utils.contains('RPI_USE_U_BOOT', '1', d.getVar('KERNEL_IMAGETYPE') or '', '', d)}"
RPI_EXTRA_IMAGE_BOOT_FILES:remove:rpi:mender-uboot:mender-update-install = "${RPI_MENDER_EXTRA_IMAGE_BOOT_FILES_REMOVE}"
