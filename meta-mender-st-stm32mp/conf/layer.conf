# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mender-community-st-stm32mp"
BBFILE_PATTERN_mender-community-st-stm32mp = "^${LAYERDIR}/"
BBFILE_PRIORITY_mender-community-st-stm32mp = "9"
LAYERSERIES_COMPAT_mender-community-st-stm32mp = "scarthgap"

BBMASK += "meta-mender-core/recipes-bsp/u-boot/u-boot-mender\.inc"
