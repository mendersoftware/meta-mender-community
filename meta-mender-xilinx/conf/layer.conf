# Mender integration for Xilinx / AMD Zynq(-7000) boards.
#
# This layer carries the Mender-specific metadata: the U-Boot fork integration
# (meta-mender only appends to the plain "u-boot" recipe, so the u-boot-xlnx
# fork needs its own bbappend) and the fpga-bitstream update module. Board
# bring-up (machine, devicetree, platform-init) lives in the nested BSP
# sub-layer meta-arty-z7, a separate collection added alongside this one. It is
# nested here for now, in the expectation that further Xilinx board
# integrations will share this layer.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mender-xilinx"
# Match this layer's own files only, not the nested meta-arty-z7 sub-layer
# (which has its own BBFILE_COLLECTIONS entry); the negative lookahead keeps a
# recipe from being claimed by two collections.
BBFILE_PATTERN_mender-xilinx = "^${LAYERDIR}/(?!meta-arty-z7/)"
BBFILE_PRIORITY_mender-xilinx = "8"

LAYERDEPENDS_mender-xilinx = "arty-z7 mender"
LAYERSERIES_COMPAT_mender-xilinx = "wrynose"
