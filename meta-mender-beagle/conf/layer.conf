# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mender-community-beagle"
BBFILE_PATTERN_mender-community-beagle = "^${LAYERDIR}/"
BBFILE_PRIORITY_mender-community-beagle = "92"
LAYERSERIES_COMPAT_mender-community-beagle = "wrynose"

# meta-ti-bsp provides the linux-ti-staging recipe and the beagleplay-ti
# machine config that we bbappend onto. RECOMMENDS rather than DEPENDS so
# the layer remains parseable for BeagleBone Black builds where meta-ti is
# not present; the bbappends live under dynamic-layers and only register
# when meta-ti-bsp is in BBLAYERS.
LAYERRECOMMENDS_mender-community-beagle = "meta-ti-bsp"

BBFILES_DYNAMIC += " \
    meta-ti-bsp:${LAYERDIR}/dynamic-layers/meta-ti-bsp/recipes-*/*/*.bb \
    meta-ti-bsp:${LAYERDIR}/dynamic-layers/meta-ti-bsp/recipes-*/*/*.bbappend \
"
