# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"
# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
		${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mender-tegra-jetpack7"
BBFILE_PATTERN_meta-mender-tegra-jetpack7 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mender-tegra-jetpack7 = "10"
LAYERVERSION_meta-mender-tegra-jetpack7 = "1"
LAYERSERIES_COMPAT_meta-mender-tegra-jetpack7 = "wrynose"
LAYERDEPENDS_meta-mender-tegra-jetpack7 = "tegra meta-mender-tegra-common"
